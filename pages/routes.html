<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuyến đường — Pam Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<nav>
  <a class="nav-logo" href="../index.html">PAM TRAVEL</a>
  <div class="nav-links">
    <a href="../index.html">Dashboard</a>
    <a href="trips.html">Chuyến xe</a>
    <a href="bookings.html">Đặt vé</a>
    <a href="users.html">Người dùng</a>
    <a href="routes.html" class="active">Tuyến đường</a>
    <a href="payments.html">Thanh toán</a>
  </div>
</nav>

<div class="page-header">
  <div>
    <h1 class="page-title">TUYẾN ĐƯỜNG</h1>
    <p class="page-sub">Tuyến xe và các điểm dừng</p>
  </div>
</div>

<div class="content">
  <!-- Routes table -->
  <div class="section-header" style="margin-bottom:1rem">
    <span class="section-title">DANH SÁCH TUYẾN</span>
  </div>
  <div class="table-wrap" style="margin-bottom:2rem">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Điểm đi</th><th>Điểm đến</th>
          <th>Giá cơ bản</th><th>Thời gian</th><th>Số điểm dừng</th>
        </tr>
      </thead>
      <tbody id="tbl-routes">
        <tr><td colspan="6" class="loading">Đang tải...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Route stops -->
  <div class="section-header" style="margin-bottom:1rem">
    <span class="section-title">ĐIỂM DỪNG</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Tuyến</th><th>Thứ tự</th>
          <th>Tên điểm</th><th>Tỉnh</th><th>Offset (phút)</th><th>Loại</th>
        </tr>
      </thead>
      <tbody id="tbl-stops">
        <tr><td colspan="7" class="loading">Đang tải...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>© 2026 <span>Pam Travel</span></footer>

<script src="../js/db.js"></script>
<script src="../js/common.js"></script>
<script>
async function loadRoutes() {
  try {
    const rows = await DB.query(`
      SELECT r.id,
             p1.name AS origin, p2.name AS dest,
             r.base_price, r.duration_minutes,
             COUNT(rs.id) AS stop_count
      FROM routes r
      JOIN provinces p1 ON r.origin_province_id      = p1.id
      JOIN provinces p2 ON r.destination_province_id = p2.id
      LEFT JOIN route_stops rs ON rs.route_id = r.id
      GROUP BY r.id, p1.name, p2.name, r.base_price, r.duration_minutes
      ORDER BY r.id
    `);
    document.getElementById('tbl-routes').innerHTML = rows.map(r => `
      <tr class="fade-up">
        <td class="mono">#${r.id}</td>
        <td><strong>${r.origin}</strong></td>
        <td><strong>${r.dest}</strong></td>
        <td class="mono">${parseInt(r.base_price).toLocaleString('vi-VN')}đ</td>
        <td class="mono">${Math.floor(r.duration_minutes/60)}h${r.duration_minutes%60 ? r.duration_minutes%60+'m' : ''}</td>
        <td class="mono">${r.stop_count} điểm</td>
      </tr>`).join('');

    const stops = await DB.query(`
      SELECT rs.id, rs.stop_order, rs.stop_name,
             p1.name AS origin, p2.name AS dest,
             pv.name AS province,
             rs.offset_minutes, rs.stop_type
      FROM route_stops rs
      JOIN routes r     ON rs.route_id    = r.id
      JOIN provinces p1 ON r.origin_province_id      = p1.id
      JOIN provinces p2 ON r.destination_province_id = p2.id
      JOIN provinces pv ON rs.province_id = pv.id
      ORDER BY rs.route_id, rs.stop_order
    `);
    document.getElementById('tbl-stops').innerHTML = stops.map(r => `
      <tr class="fade-up">
        <td class="mono">#${r.id}</td>
        <td>${r.origin} → ${r.dest}</td>
        <td class="mono" style="text-align:center">${r.stop_order}</td>
        <td>${r.stop_name}</td>
        <td>${r.province}</td>
        <td class="mono">${r.offset_minutes} phút</td>
        <td><span class="badge badge-stop-${r.stop_type.toLowerCase()}">${r.stop_type}</span></td>
      </tr>`).join('');
  } catch(e) {
    showError('tbl-routes', 6, e.message);
    showError('tbl-stops',  7, e.message);
  }
}
loadRoutes();
</script>
</body>
</html>
